name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request or branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # work-journal depends on the macOS-only sherpa-onnx binding, so test on macOS.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: work-journal
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: work-journal/go.mod
          cache-dependency-path: work-journal/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  test-linux:
    # The sherpa binding sits behind a darwin build tag, so the rest of the app
    # must keep building on Linux, where cloud agents run.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work-journal
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: work-journal/go.mod
          cache-dependency-path: work-journal/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
