name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # work-journal depends on the macOS-only sherpa-onnx binding, so test on macOS.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: work-journal
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: work-journal/go.mod
          cache-dependency-path: work-journal/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
