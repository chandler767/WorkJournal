# work-journal configuration. Every key is optional; defaults shown.
# data_dir = "/Users/you/WorkJournal"   # default: $HOME/WorkJournal
retention_days = 7
close_time = "18:00"
rollup_weekday = "Friday"
idle_minutes = 5
pause_auto_resume_minutes = 60
# Screenshots are change-driven: on an app/window switch, when the screen changes, and at least
# every screenshot_idle_backstop_sec; never closer than screenshot_min_gap_sec. Restart the recorder to apply.
screenshot_min_gap_sec = 3            # 1-60; triggers inside the gap are deferred to its end, not dropped
screenshot_idle_backstop_sec = 60     # 10-600; a screenshot at least this often while nothing changes
screen_change_sensitivity = "medium"  # "low" (big changes only), "medium" or "high" (small edits too)
capture_on_app_switch = true          # screenshot right away when the frontmost app or window changes
meeting_screenshot_interval_sec = 5   # backstop during meetings (the min gap still applies)
screenshot_interval_sec = 10          # unused: replaced by screenshot_idle_backstop_sec; kept so older files load
audio_chunk_minutes = 5
screenshot_width = 1440     # per display: with all_displays the image is this × displays wide
all_displays = false        # all displays side by side (left to right) instead of the main one
whisper_model = "base.en"
diarization = "sherpa"       # "sherpa" (local speaker diarization) or "off" (system speech is "others")
voice_match_threshold = 0.60  # cosine similarity to name a known voice
name_confidence_threshold = 0.7
min_free_gb = 5
listen_addr = "127.0.0.1:4747"
meeting_min_two_way_minutes = 2
# In-person meetings: mic-only conversation (nobody on a call) where your mic hears speech
# for at least in_person_speech_ratio of a rolling 5-minute window, lasting in_person_min_minutes.
in_person_min_minutes = 5      # 1-120
in_person_speech_ratio = 0.4   # 0.05-1
process_interval_minutes = 15  # summarize the hour in progress every N minutes: 5, 10, 15, 20, 30 or 60 (60: only finished hours)
excluded_apps = ["1Password", "Keychain Access"]
excluded_title_keywords = ["Private", "Incognito"]
meeting_apps = ["zoom.us", "Microsoft Teams", "FaceTime"]
meeting_title_keywords = ["Huddle", "Google Meet", "Meet -", "Microsoft Teams", "Zoom Meeting"]
categories = ["Deep work", "Meetings", "Communication", "Admin", "Browsing/Research", "Break/Idle"]

# Substring of app name or window title -> category
[rules]
# "Xcode" = "Deep work"
