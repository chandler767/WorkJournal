# work-journal configuration. Every key is optional; defaults shown.
# data_dir = "/Users/you/WorkJournal"   # default: $HOME/WorkJournal
retention_days = 7
close_time = "18:00"
rollup_weekday = "Friday"
idle_minutes = 5
pause_auto_resume_minutes = 60
screenshot_interval_sec = 10
meeting_screenshot_interval_sec = 5
audio_chunk_minutes = 5
screenshot_width = 1440     # per display: with all_displays the image is this × displays wide
all_displays = false        # all displays side by side (left to right) instead of the main one
whisper_model = "base.en"
diarization = "sherpa"       # "sherpa" (local speaker diarization) or "off" (system speech is "others")
voice_match_threshold = 0.60  # cosine similarity to name a known voice
name_confidence_threshold = 0.7
min_free_gb = 5
listen_addr = "127.0.0.1:4747"
meeting_min_two_way_minutes = 2
process_interval_minutes = 15  # summarize the hour in progress every N minutes: 5, 10, 15, 20, 30 or 60 (60: only finished hours)
excluded_apps = ["1Password", "Keychain Access"]
excluded_title_keywords = ["Private", "Incognito"]
meeting_apps = ["zoom.us", "Microsoft Teams", "FaceTime"]
meeting_title_keywords = ["Huddle", "Google Meet", "Meet -", "Microsoft Teams", "Zoom Meeting"]
categories = ["Deep work", "Meetings", "Communication", "Admin", "Browsing/Research", "Break/Idle"]

# Substring of app name or window title -> category
[rules]
# "Xcode" = "Deep work"
